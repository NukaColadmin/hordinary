# Les deux suites du depot, a chaque push et sur chaque pull request.
#
# Windows, et non Ubuntu : c'est la seule plateforme ou les deux suites ont ete eprouvees. Le jeu
# n'est pas construit ici — Hordinary.Core ne reference pas Godot, et les tests ne dependent que de
# lui. Ni reseau ni cle : le service de langage se teste sur des bouchons, et les tests qui cherchent
# Fast Downward ou VAL changent de question quand ils ne les trouvent pas (Tests/SatisfiabilityTests).
name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test Tests/Hordinary.Tests.csproj --logger "console;verbosity=minimal"
      - run: dotnet list ../Hordinary.sln package --vulnerable --include-transitive --format json > vulnerabilities.json
        working-directory: Tests
      - shell: pwsh
        run: |
          $audit = Get-Content Tests/vulnerabilities.json -Raw | ConvertFrom-Json
          $affected = @($audit.projects | ForEach-Object { $_.frameworks } | ForEach-Object { $_.topLevelPackages; $_.transitivePackages } | Where-Object { $_.vulnerabilities.Count -gt 0 })
          if ($affected.Count -gt 0) { throw "Dependances NuGet vulnerables detectees." }

  service:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements.txt
      # Les deux fichiers doivent etre compatibles : une mise a jour sans nouveau verrou echoue.
      - run: python -m pip install -r requirements.txt -r requirements.in
      - run: python -m pip check
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - run: python -m pytest tests/ -q
      - run: python -m evals.run --dry-run
